name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Pages serves the site from /<repo>/, so assets, routes and share links
      # need that prefix.
      - name: Build web export
        run: npm run build:web
        env:
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}

      # Pages has no rewrites: dynamic routes like /trip/<id> fall through to
      # 404.html, where the client router takes over.
      - name: Add 404 fallback
        run: cp "dist/+not-found.html" dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
